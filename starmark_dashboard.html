<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{--bg:#eef1f6;--card:#fff;--card2:#f5f7fa;--line:#e6ebf2;--txt:#1a2230;--mut:#72808f;--shadow:0 1px 2px rgba(16,40,80,.06),0 6px 22px rgba(16,40,80,.07);
    --navy:#004A77;--blue:#0072BC;--sky:#7AC9D8;--green:#8DC63F;--red:#ED1C24;--orangered:#F15A24;--orange:#F7941E;--peach:#FFC168;}
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Kanit',sans-serif}
  body{background:var(--bg);color:var(--txt);min-height:100vh;display:flex}
  .side{width:236px;background:var(--card);border-right:1px solid var(--line);min-height:100vh;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
  .brand{display:flex;align-items:center;gap:11px;padding:6px 8px 10px}
  .logo-img{width:100%;max-width:186px;height:auto;display:block}
  .brandsub{font-size:.68rem;color:var(--mut);font-weight:600;letter-spacing:.4px;padding:0 10px 14px;border-bottom:1px solid var(--line);margin-bottom:6px}
  .navlbl{font-size:.68rem;color:var(--mut);font-weight:700;letter-spacing:.6px;padding:8px 10px 4px;text-transform:uppercase}
  .nav{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:11px;color:var(--mut);cursor:pointer;font-weight:600;font-size:.92rem;transition:.15s}
  .nav .ic{font-size:1.1rem;width:22px;text-align:center}
  .nav:hover{background:var(--card2);color:var(--txt)} .nav.active{background:linear-gradient(135deg,rgba(0,114,188,.12),rgba(0,74,119,.08));color:var(--navy)}
  .side .foot{margin-top:auto;padding:12px 10px;border-top:1px solid var(--line);font-size:.72rem;color:var(--mut);line-height:1.7}
  .live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:5px;animation:pulse 1.6s infinite;vertical-align:middle}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  main{flex:1;padding:22px 26px;min-width:0}
  .topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:18px}
  .topbar h1{font-size:1.35rem;font-weight:800;color:var(--txt)} .topbar h1 span:first-child{color:var(--blue)}
  .sub{font-size:.74rem;color:var(--mut);margin-top:3px;font-weight:500}
  .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .ctrls{display:flex;gap:4px;align-items:center;flex-wrap:wrap;background:var(--card);padding:5px;border-radius:12px;border:1px solid var(--line);box-shadow:var(--shadow)}
  .rangebtn{padding:7px 11px;background:transparent;border:none;border-radius:8px;color:var(--mut);cursor:pointer;font-size:.8rem;font-weight:600;font-family:'Kanit',sans-serif}
  .rangebtn.active{background:var(--blue);color:#fff}
  .selpool{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--txt);font-family:'Kanit',sans-serif;font-size:.82rem;box-shadow:var(--shadow);max-width:190px}
  .iconbtn{padding:9px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--txt);cursor:pointer;font-size:.82rem;font-family:'Kanit',sans-serif;box-shadow:var(--shadow)}
  .iconbtn:hover{border-color:var(--blue);color:var(--blue)}
  .grid{display:grid;gap:16px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(175px,1fr));margin-bottom:16px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:var(--shadow);display:flex;align-items:center;gap:13px}
  .kpi .ico{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:1.35rem;flex-shrink:0}
  .kpi .v{font-size:1.65rem;font-weight:800;line-height:1.05} .kpi .l{font-size:.76rem;color:var(--mut);margin-top:2px}
  .tint-b{background:rgba(0,114,188,.12)}.tint-g{background:rgba(141,198,63,.16)}.tint-o{background:rgba(247,148,30,.15)}.tint-r{background:rgba(237,28,36,.12)}.tint-n{background:rgba(0,74,119,.12)}.tint-p{background:rgba(122,201,216,.2)}
  .cl-b{color:var(--blue)}.cl-g{color:#6ca01e}.cl-o{color:var(--orange)}.cl-r{color:var(--red)}.cl-n{color:var(--navy)}
  .cover{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 18px;box-shadow:var(--shadow);margin-bottom:16px}
  .cover .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
  .cover .lb{font-size:.85rem;color:var(--txt);font-weight:600} .cover .lb b{color:var(--navy)} .cover .pc{font-size:.85rem;font-weight:800;color:var(--blue)}
  .cbar{height:9px;border-radius:6px;background:#eef1f5;overflow:hidden} .cbar>span{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--blue))}
  .row2{grid-template-columns:1fr 1fr}@media(max-width:1000px){.row2{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:16px}
  .panel h3{font-size:.95rem;margin-bottom:15px;font-weight:700;color:var(--txt);display:flex;align-items:center;gap:8px}
  .panel h3::before{content:'';width:4px;height:16px;border-radius:3px;background:var(--blue)}
  .chartwrap{position:relative;height:270px}
  table{width:100%;border-collapse:collapse;font-size:.85rem}
  th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line)}
  th{color:var(--mut);font-weight:700;font-size:.76rem} td.num,th.num{text-align:right}
  tbody tr:hover td{background:var(--card2)} tbody tr:last-child td{border-bottom:none}
  .rank{display:inline-flex;width:23px;height:23px;border-radius:50%;background:var(--card2);align-items:center;justify-content:center;font-size:.74rem;font-weight:800;margin-right:8px;color:var(--txt)}
  .rank.g1{background:#fcd34d;color:#000}.rank.g2{background:#cbd5e1;color:#000}.rank.g3{background:var(--peach);color:#7a3d00}
  .badge{display:inline-block;padding:3px 9px;border-radius:7px;font-size:.75rem;font-weight:700}
  .loading{text-align:center;padding:60px;color:var(--mut);line-height:1.9}
  #body{animation:fadeIn .22s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
  .kpi{transition:transform .12s ease,box-shadow .12s ease}
  .kpi:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(16,40,80,.13)}
  .dlt-up{color:#5a8a15;font-weight:700} .dlt-dn{color:var(--red);font-weight:700}
  .exporting{background:#fff!important;padding:16px}
  .exporting .panel,.exporting .kpi,.exporting .cover{box-shadow:none!important;border:1px solid #c2cddb!important}
  .exporting .kpi .ico{filter:saturate(1.35) brightness(.97)}
  .exp-head{padding:2px 4px 14px;border-bottom:3px solid #0072BC;margin-bottom:16px}
  .exp-head .t{font-weight:800;font-size:1.25rem;color:#004A77}
  .exp-head .s{font-size:.82rem;color:#5a6572;margin-top:3px}
  @media print{ .side{display:none!important} .tools{display:none!important} main{padding:0!important} body{background:#fff!important} .panel,.kpi,.cover{box-shadow:none!important;border:1px solid #d5dde7!important;break-inside:avoid;page-break-inside:avoid} .chartwrap{height:240px!important} }
  #body{transition:opacity .18s ease}
  .muted-note{font-size:.76rem;color:var(--mut);margin:-4px 0 12px}
  .mbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .msorts{display:flex;gap:5px;align-items:center;background:var(--card);padding:5px;border-radius:11px;border:1px solid var(--line);box-shadow:var(--shadow)}
  .mlb{font-size:.76rem;color:var(--mut);padding:0 4px}
  .msbtn{padding:7px 11px;border:none;border-radius:8px;background:transparent;color:var(--mut);font-family:'Kanit',sans-serif;font-size:.8rem;font-weight:600;cursor:pointer}
  .msbtn.on{background:var(--blue);color:#fff}
  .msearch{padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-family:'Kanit',sans-serif;font-size:.82rem;box-shadow:var(--shadow);min-width:200px;flex:1;max-width:280px}
  .msearch:focus{outline:none;border-color:var(--blue)}
  .poolchip{display:inline-block;padding:2px 9px;border-radius:20px;background:rgba(0,114,188,.1);color:var(--navy);font-size:.74rem;font-weight:600}
  .mtable td{font-size:.82rem} .mrow{cursor:pointer} .mrow:hover td{background:#eef5fb}
  .detrow td{background:#f7fafd!important;padding:0}
  .rdwrap{padding:12px 16px} .rdhd{font-size:.82rem;font-weight:700;color:var(--navy);margin-bottom:8px}
  .rdrow{font-size:.8rem;padding:5px 0;border-top:1px dashed var(--line);line-height:1.6}
  .mid{color:var(--mut)}
  .dbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .dchk{display:flex;align-items:center;gap:6px;font-size:.84rem;color:var(--txt);background:var(--card);padding:8px 12px;border-radius:10px;border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer}
  .dedname{margin-left:auto;font-size:.82rem;color:var(--navy);font-weight:600}
  .dcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow);margin-bottom:12px}
  .dhd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:4px}
  .dstatus{font-size:.74rem;font-weight:700;background:var(--card2);color:var(--navy);padding:3px 9px;border-radius:20px;white-space:nowrap}
  .dmeta{font-size:.76rem;color:var(--mut);margin-bottom:11px}
  .dcard label{display:block;font-size:.74rem;color:var(--mut);font-weight:600;margin:8px 0 4px}
  .din{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;font-family:'Kanit',sans-serif;font-size:.86rem;box-sizing:border-box}
  .din:focus{outline:none;border-color:var(--blue)}
  .drow2{display:flex;gap:10px}.drow2>div{flex:1}
  .drow3{display:flex;gap:8px}.drow3>div{flex:1}
  .dsave{margin-top:12px;width:100%;padding:10px;background:var(--blue);color:#fff;border:none;border-radius:10px;font-family:'Kanit',sans-serif;font-size:.86rem;font-weight:700;cursor:pointer}
  .dsave:hover{background:var(--navy)} .dsave:disabled{opacity:.7}
  .setlbl{display:block;font-size:.82rem;color:var(--mut);font-weight:600;margin:6px 0 6px}
  .setinp{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;font-family:'Kanit',sans-serif;font-size:.9rem;color:var(--txt)}
  .setinp:focus{outline:none;border-color:var(--blue)} .setinp[readonly]{background:var(--card2);color:var(--mut)}
  .setrow{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .setbtn{padding:9px 15px;border:1.5px solid var(--line);border-radius:9px;background:var(--card);color:var(--txt);font-family:'Kanit',sans-serif;font-size:.85rem;font-weight:600;cursor:pointer}
  .setbtn:hover{border-color:var(--blue);color:var(--blue)} .setbtn.primary{background:var(--blue);color:#fff;border-color:var(--blue)} .setbtn.primary:hover{background:var(--navy)}
  .setbtn.warn{border-color:var(--orange);color:var(--orange)} .lockpill{font-size:.78rem;color:var(--green);font-weight:700}
  .setst{margin-top:12px;font-size:.85rem;font-weight:600;min-height:20px} .sethint{margin-top:16px;font-size:.76rem;color:var(--mut);line-height:1.8;border-top:1px solid var(--line);padding-top:12px}
  .sethint code{background:var(--card2);padding:1px 5px;border-radius:4px;color:var(--navy)}
  @media(max-width:820px){body{flex-direction:column}.side{width:100%;height:auto;min-height:0;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:center;padding:10px 12px 12px;gap:8px}.brand{flex-basis:100%;justify-content:center;padding:0;margin:0 0 4px}.logo-img{max-width:150px}.navlbl,.side .foot,.brandsub{display:none}.nav{flex:1 1 0;min-width:0;justify-content:center;gap:7px;padding:10px 6px;font-size:.86rem}.nav .ic{font-size:1rem}main{padding:16px 4px}.panel{padding:15px 6px}.cover{padding:14px 6px}.capbtn{display:none!important}}
</style>

<script>

function _lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

let RANGE='today', POOL='', TAB='pm', DATA=null, CHARTS=[], TIMER=null, LAST_SIG='';
let MSORT='missed', MSEARCH='', MEXPAND='';
let EDITOR=null, DOCS=null, DOCS_ONLY=true, DOCS_MONTHS=3, DOCS_FILTER='pending';

function ckey(){ return RANGE+'|'+POOL+'|'+wantM(); }

/* ═══════════════════════════════════════════════════════════════════════
   SupabaseDash — สะพานเชื่อมแดชบอร์ดเข้ากับ Supabase
   ───────────────────────────────────────────────────────────────────────
   หน้าตาและโค้ดวาดหน้าจอทั้งหมด "ไม่ถูกแตะเลยสักบรรทัด"
   เปลี่ยนแค่ฟังก์ชัน call() ที่เป็นประตูออกไปหลังบ้านตัวเดียว
   แล้วประกอบข้อมูลให้มีรูปร่างเหมือนที่ Apps Script เคยส่งมาเป๊ะ ๆ

   สลับกลับไปใช้ Apps Script ได้ทันทีด้วย  BACKEND = 'gas'
═══════════════════════════════════════════════════════════════════════ */

var BACKEND = 'supabase';              /* 'supabase' | 'gas'  ← สวิตช์ */
var SB_URL  = 'https://lktiusfceceywpkzuqaq.supabase.co';
var SB_KEY  = 'sb_publishable_4L3fWwfb2zvU1wWDO9g4nQ_tloXtUpS';

var _sb = null;
function sbReady(){
  if(_sb) return Promise.resolve(_sb);
  return new Promise(function(res, rej){
    function boot(){
      if(!window.supabase || !window.supabase.createClient) return rej(new Error('DATA|โหลด supabase-js ไม่ได้'));
      _sb = window.supabase.createClient(SB_URL, SB_KEY, { auth:{ persistSession:false } });
      res(_sb);
    }
    if(window.supabase && window.supabase.createClient) return boot();
    var sc=document.createElement('script');
    sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
    sc.onload=boot; sc.onerror=function(){ rej(new Error('NETWORK|โหลด supabase-js ไม่ได้')); };
    setTimeout(function(){ rej(new Error('NETWORK|หมดเวลารอ supabase-js')); }, 9000);
    document.head.appendChild(sc);
  });
}

/* ── ตัวช่วยวันเวลา — อิงเวลาไทยเสมอ ไม่อิงนาฬิกาเครื่อง ─────────── */
function _today(){ return new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'}); }
function _ago(n){ var d=new Date(); d.setDate(d.getDate()-n);
  return d.toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'}); }
function _nowStr(){ var d=new Date();
  return d.toLocaleDateString('th-TH',{timeZone:'Asia/Bangkok',day:'2-digit',month:'short'})
       + ' ' + d.toLocaleTimeString('th-TH',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit'}); }

/* Pool จาก line: "1_MP322" -> "MP322" */
function _pool(line){
  var s=String(line||'').trim(); if(!s) return '';
  var m=s.match(/_([A-Za-z]*\d+)\s*$/);
  return m ? m[1].toUpperCase() : s.toUpperCase();
}

var RANGES_SB = { today:{label:'วันนี้',days:1}, '7d':{label:'7 วัน',days:7},
  '1m':{label:'1 เดือน',days:30}, '3m':{label:'3 เดือน',days:90},
  '6m':{label:'6 เดือน',days:180}, '12m':{label:'1 ปี',days:365},
  '1y':{label:'1 ปี',days:365} };

/* PostgREST คืนได้ครั้งละ 1000 แถว — ต้องวนดึงเป็นหน้า
   ไม่งั้นช่วง 6 เดือน/1 ปี จะได้ข้อมูลไม่ครบโดยไม่มี error เตือน */
function _all(build){
  var SIZE=1000, out=[];
  function next(from){
    return build().range(from, from+SIZE-1).then(function(r){
      if(r.error) throw new Error('DATA|'+r.error.message);
      var d=r.data||[]; out=out.concat(d);
      if(d.length<SIZE || from>200000) return out;
      return next(from+SIZE);
    });
  }
  return next(0);
}

var OPEN_ST = ['new','waiting','assigned','working','pending_confirm'];
function _isOpen(s){ return OPEN_ST.indexOf(String(s||'')) >= 0; }
function _cost(j){ return (+j.cost_parts||0)+(+j.cost_internal||0)+(+j.cost_external||0); }
function _month(d){ return String(d||'').slice(0,7); }

/* ── ดึงข้อมูลดิบชุดใหญ่ครั้งเดียว แล้วแบ่งใช้ทุก action ────────────── */
var _cacheRaw = {};
function _raw(days, pool){
  var key = days+'|'+(pool||'');
  if(_cacheRaw[key] && Date.now()-_cacheRaw[key].t < 45000) return Promise.resolve(_cacheRaw[key].v);
  return sbReady().then(function(db){
    var from = days<=1 ? _today() : _ago(days);
    return Promise.all([
      _all(function(){ return db.from('machines').select('id,line,name,status').order('id'); }),
      _all(function(){ return db.from('pm_records')
        .select('id,pm_date,pm_time,machine_id,line,machine_name,machine_status,inspector_name,inspector_id')
        .gte('pm_date', from); }),
      _all(function(){ return db.from('jobs')
        .select('id,asset_id,line,machine_name,status,problem_type,problem_detail,note,created_at,done_at,closed_at,assigned_at,accepted_at,assigned_name,assigned_to,pr,po,rc,parts_detail,wait_minutes,cost_parts,cost_internal,cost_external')
        .gte('created_at', (days<=1?_today():_ago(days))+'T00:00:00'); }),
    ]).then(function(a){
      var mAll=a[0], pm=a[1], jobs=a[2];
      var inPool = function(ln){ return !pool || _pool(ln)===pool; };
      var act = mAll.filter(function(m){ return m.status==='active' && inPool(m.line); });
      var ids = {}; act.forEach(function(m){ ids[m.id]=1; });
      var v = {
        from: from,
        machines: act,
        pools: Object.keys(mAll.reduce(function(o,m){ var p=_pool(m.line); if(p) o[p]=1; return o; },{})).sort(),
        pm:   pm.filter(function(r){ return ids[r.machine_id]; }),
        jobs: jobs.filter(function(j){ return inPool(j.line); }),
      };
      _cacheRaw[key]={t:Date.now(), v:v};
      return v;
    });
  });
}

/* ═══════════ getDashboardData ═══════════ */
function _dashboard(pl){
  var rk = pl.range || 'today';
  var R  = RANGES_SB[rk] || RANGES_SB.today;
  var pool = pl.pool || '';
  return _raw(R.days, pool).then(function(x){
    var today=_today(), total=x.machines.length;

    /* ── PM ── */
    var todayRec = x.pm.filter(function(r){ return r.pm_date===today; });
    var doneSet={}, latest={};
    todayRec.forEach(function(r){
      doneSet[r.machine_id]=1;
      if(!latest[r.machine_id]) latest[r.machine_id]=r;
    });
    var doneToday=Object.keys(doneSet).length;
    var st={normal:0,broken:0,repair:0,idle:0};
    Object.keys(latest).forEach(function(k){
      var v=latest[k].machine_status||'normal';
      if(st[v]===undefined) v='normal'; st[v]++;
    });
    var covSet={}; x.pm.forEach(function(r){ covSet[r.machine_id]=1; });
    var covCnt=Object.keys(covSet).length;

    /* แนวโน้มรายเดือน — เครื่องที่ทำ PM, เสีย, ไม่ใช้งาน */
    var mo={};
    x.pm.forEach(function(r){
      var k=_month(r.pm_date); if(!k) return;
      var o=mo[k]||(mo[k]={mach:{},broken:{},idle:{}});
      o.mach[r.machine_id]=1;
      if(r.machine_status==='broken') o.broken[r.machine_id]=1;
      if(r.machine_status==='idle')   o.idle[r.machine_id]=1;
    });
    var pmTrend=Object.keys(mo).sort().map(function(k){
      return { month:k, machines:Object.keys(mo[k].mach).length,
               broken:Object.keys(mo[k].broken).length, idle:Object.keys(mo[k].idle).length };
    });

    /* ── งานซ่อม ── */
    var J=x.jobs;
    var closed=J.filter(function(j){ return j.status==='closed'; });
    var pending=J.filter(function(j){ return _isOpen(j.status); }).length;

    /* MTTR = เวลาเฉลี่ยตั้งแต่แจ้งจนปิดงาน (นาที) */
    var mt=[], byP={}, cost={parts:0,internal:0,external:0,total:0};
    J.forEach(function(j){
      var p=String(j.problem_type||'ไม่ระบุ').trim(); byP[p]=(byP[p]||0)+1;
      cost.parts    += (+j.cost_parts||0);
      cost.internal += (+j.cost_internal||0);
      cost.external += (+j.cost_external||0);
    });
    cost.total = cost.parts+cost.internal+cost.external;
    closed.forEach(function(j){
      if(!j.created_at || !j.closed_at) return;
      var d=(new Date(j.closed_at)-new Date(j.created_at))/60000;
      if(d>0 && d<60*24*90) mt.push(d);
    });
    var mttr = mt.length ? Math.round(mt.reduce(function(a,b){return a+b;},0)/mt.length) : 0;

    /* แนวโน้มงานซ่อมรายเดือน */
    var rm={};
    J.forEach(function(j){
      var k=_month(String(j.created_at||'').slice(0,10)); if(!k) return;
      var o=rm[k]||(rm[k]={count:0,cost:0,dt:0});
      o.count++; o.cost+=_cost(j); o.dt+=(+j.wait_minutes||0);
    });
    var rTrend=Object.keys(rm).sort().map(function(k){
      return { month:k, count:rm[k].count, cost:Math.round(rm[k].cost), downtimeMin:Math.round(rm[k].dt) };
    });

    /* เครื่องที่ซ่อมบ่อย */
    var tm={};
    J.forEach(function(j){
      var a=String(j.asset_id||'').trim(); if(!a) return;
      var o=tm[a]||(tm[a]={id:a,machine:j.machine_name||'',count:0,cost:0,lastDate:''});
      o.count++; o.cost+=_cost(j);
      var d=String(j.created_at||'').slice(0,10);
      if(d>o.lastDate) o.lastDate=d;
    });
    var topM=Object.keys(tm).map(function(k){return tm[k];})
      .sort(function(a,b){ return b.count-a.count; }).slice(0,15);

    /* KPI ช่าง */
    var tk={};
    J.forEach(function(j){
      var n=String(j.assigned_name||'').trim(); if(!n) return;
      var o=tk[n]||(tk[n]={tech:n,closed:0,backlog:0,resp:[],work:[],onTime:0,cnt:0});
      if(j.status==='closed') o.closed++; else if(_isOpen(j.status)) o.backlog++;
      if(j.created_at && j.accepted_at){
        var r1=(new Date(j.accepted_at)-new Date(j.created_at))/60000;
        if(r1>0 && r1<60*24*30) o.resp.push(r1);
      }
      if(j.accepted_at && j.done_at){
        var w=(new Date(j.done_at)-new Date(j.accepted_at))/60000;
        if(w>0 && w<60*24*60){ o.work.push(w); o.cnt++; if(w<=60*24) o.onTime++; }
      }
    });
    var avg=function(a){ return a.length?Math.round(a.reduce(function(x2,y){return x2+y;},0)/a.length):null; };
    var techKPI=Object.keys(tk).map(function(k){
      var o=tk[k];
      return { tech:o.tech, closed:o.closed, backlog:o.backlog,
               avgRespMin:avg(o.resp), avgWorkMin:avg(o.work),
               onTimePct: o.cnt ? Math.round(o.onTime/o.cnt*100) : null };
    }).sort(function(a,b){ return b.closed-a.closed; });

    var out = {
      ok:true,
      range:{ key:rk, label:R.label, days:R.days },
      pool:pool, pools:x.pools, generatedAt:_nowStr(),
      pm:{
        totalMachines: total, doneToday: doneToday,
        notDoneToday: Math.max(0,total-doneToday),
        compliancePct: total?Math.round(doneToday*100/total):0,
        coverageCount: covCnt,
        coveragePct: total?Math.round(covCnt*100/total):0,
        statusCounts: st, monthlyTrend: pmTrend,
      },
      repair:{
        total:J.length, closed:closed.length, pending:pending, mttrMin:mttr,
        byProblem:byP, monthlyTrend:rTrend, techKPI:techKPI,
        cost:{ parts:Math.round(cost.parts), internal:Math.round(cost.internal),
               external:Math.round(cost.external), total:Math.round(cost.total) },
        topMachines: topM,
      },
      machineTab: null,
    };

    if(pl.machines) out.machineTab = _machineTab(x, R);
    return out;
  });
}

/* ═══════════ แท็บรายเครื่องจักร ═══════════ */
function _machineTab(x, R){
  /* วันทำงานในช่วง — นับทุกวันยกเว้นอาทิตย์ (ตรงกับที่โรงงานใช้) */
  var wd=0, d=new Date();
  for(var i=0;i<R.days;i++){ if(d.getDay()!==0) wd++; d.setDate(d.getDate()-1); }

  var doneBy={}, stBy={}, lastBy={};
  x.pm.forEach(function(r){
    var m=r.machine_id;
    (doneBy[m]=doneBy[m]||{})[r.pm_date]=1;
    var s=r.machine_status||'normal';
    var o=stBy[m]||(stBy[m]={broken:0,idle:0});
    if(s==='broken') o.broken++; else if(s==='idle') o.idle++;
    if(!lastBy[m] || r.pm_date>lastBy[m]) lastBy[m]=r.pm_date;
  });
  var jb={}, log=[];
  x.jobs.forEach(function(j){
    var a=String(j.asset_id||'').trim(); if(!a) return;
    var o=jb[a]||(jb[a]={n:0,cost:0}); o.n++; o.cost+=_cost(j);
    log.push({ id:a, machine:j.machine_name||'', date:String(j.created_at||'').slice(0,10),
               problemType:j.problem_type||'-', detail:j.problem_detail||'',
               note:j.note||'', cost:_cost(j) });
  });
  log.sort(function(a,b){ return a.date<b.date?1:-1; });

  var list=x.machines.map(function(m){
    var days=Object.keys(doneBy[m.id]||{}).length;
    var s=stBy[m.id]||{broken:0,idle:0};
    var j=jb[m.id]||{n:0,cost:0};
    return { id:m.id, name:m.name||'', pool:_pool(m.line)||'ไม่ระบุ',
             missed: Math.max(0, wd-days), idle:s.idle, broken:s.broken,
             repairJobs:j.n, repairCost:Math.round(j.cost),
             lastPM: lastBy[m.id] ? _beDay(lastBy[m.id]) : '' };
  });
  return { list:list, repairLog:log, workingDays:wd };
}
function _beDay(d){
  if(!d) return ''; var p=String(d).split('-');
  return p[2]+'/'+p[1]+'/'+(+p[0]+543);
}

/* ═══════════ action อื่น ๆ ═══════════ */
function _handle(pl){
  var a = pl.action || 'getDashboardData';

  if(a==='getDashboardData') return _dashboard(pl);

  return sbReady().then(function(db){

    if(a==='listMachines'){
      return _all(function(){ return db.from('machines')
        .select('id,line,name,status').eq('status','active').order('id'); })
        .then(function(d){
          return { ok:true, machines:d.map(function(m){
            return { id:m.id, machineId:m.id, name:m.name||'', line:m.line||'',
                     pool:_pool(m.line), status:m.status };
          })};
        });
    }

    if(a==='getPMMissed'){
      var today=_today();
      return Promise.all([
        _all(function(){ return db.from('machines').select('id,line,name').eq('status','active'); }),
        _all(function(){ return db.from('pm_records').select('machine_id').eq('pm_date', today); }),
      ]).then(function(r){
        var done={}; r[1].forEach(function(x2){ done[x2.machine_id]=1; });
        return { ok:true, missed: r[0].filter(function(m){ return !done[m.id]; })
          .map(function(m){ return { id:m.id, machineId:m.id, name:m.name||'',
                                     machineName:m.name||'', line:m.line||'', pool:_pool(m.line) }; }) };
      });
    }

    if(a==='getDashboardSummary'){
      var t2=_today();
      return _all(function(){ return db.from('pm_records')
        .select('id,machine_id,machine_name,line,machine_status,inspector_name,pm_time')
        .eq('pm_date', t2).order('pm_time',{ascending:false}); })
        .then(function(d){
          /* เครื่องเดียวทำหลายรอบ นับครั้งล่าสุดครั้งเดียว */
          var seen={}, recs=[];
          d.forEach(function(r){
            if(seen[r.machine_id]) return; seen[r.machine_id]=1;
            recs.push({ machineId:r.machine_id, machineName:r.machine_name||'',
                        line:r.line||'', techName:r.inspector_name||'',
                        status:r.machine_status||'normal',
                        time:String(r.pm_time||'').slice(0,5) });
          });
          return { ok:true, doneRecords:recs };
        });
    }

    if(a==='getDailyReport'){
      var y=+pl.year || new Date().getFullYear();
      var m2=+pl.month || (new Date().getMonth()+1);
      var mm=(m2<10?'0':'')+m2;
      var first=y+'-'+mm+'-01';
      var last =new Date(y, m2, 0).getDate();
      var lastD=y+'-'+mm+'-'+(last<10?'0':'')+last;
      return Promise.all([
        _all(function(){ return db.from('machines').select('id').eq('status','active'); }),
        _all(function(){ return db.from('pm_records')
          .select('machine_id,pm_date,pm_time,machine_status')
          .gte('pm_date',first).lte('pm_date',lastD).order('pm_time',{ascending:false}); }),
      ]).then(function(r){
        var tot=r[0].length, byDay={};
        r[1].forEach(function(x2){
          var day=+String(x2.pm_date).slice(8,10);
          var o=byDay[day]||(byDay[day]={seen:{},normal:0,broken:0,repair:0,idle:0});
          if(o.seen[x2.machine_id]) return; o.seen[x2.machine_id]=1;
          var s=x2.machine_status||'normal';
          if(o[s]===undefined) s='normal'; o[s]++;
        });
        var ds=Object.keys(byDay).map(function(k){
          var o=byDay[k], done=Object.keys(o.seen).length;
          return { day:+k, normal:o.normal, broken:o.broken, repair:o.repair,
                   idle:o.idle, missedPM:Math.max(0,tot-done), total:tot };
        }).sort(function(x2,y2){ return x2.day-y2.day; });
        return { ok:true, dailyStats:ds, totalMachines:tot };
      });
    }

    if(a==='getJobs'){
      return _all(function(){ return db.from('jobs').select('*')
        .order('created_at',{ascending:false}); })
        .then(function(d){ return { ok:true, jobs:d.map(_jobOut) }; });
    }

    if(a==='getRepairDocs'){
      var mo=+pl.months||3;
      return _all(function(){ return db.from('jobs')
        .select('id,asset_id,machine_name,status,problem_type,created_at,assigned_name,pr,po,rc,note,parts_detail,cost_parts,cost_internal,cost_external')
        .gte('created_at', _ago(mo*30)+'T00:00:00')
        .order('created_at',{ascending:false}); })
        .then(function(d){
          var list=d.map(function(j){
            return { id:j.id, assetId:j.asset_id||'', machine:j.machine_name||'',
                     status:j.status||'', problemType:j.problem_type||'',
                     date:String(j.created_at||'').slice(0,10), tech:j.assigned_name||'',
                     pr:j.pr||'', po:j.po||'', rc:j.rc||'', note:j.note||'',
                     partsDetail:j.parts_detail||'',
                     costParts:+j.cost_parts||0, costInternal:+j.cost_internal||0,
                     costExternal:+j.cost_external||0 };
          });
          if(pl.onlyMissing) list=list.filter(function(x2){
            return !String(x2.pr).trim() && !String(x2.po).trim(); });
          return { ok:true, list:list };
        });
    }

    if(a==='getPartsCatalog'){
      return _all(function(){ return db.from('parts_catalog')
        .select('name,supplier,last_price').order('name'); })
        .then(function(d){
          return { ok:true, parts:d.map(function(p){
            return { name:p.name, supplier:p.supplier||'', lastPrice:+p.last_price||0 }; })};
        });
    }

    if(a==='savePart'){
      return db.from('parts_catalog').upsert({
        name:String(pl.name||'').trim(), supplier:pl.supplier||'',
        last_price:+pl.price||0, updated_at:new Date().toISOString()
      }).then(function(r){
        if(r.error) throw new Error('DATA|'+r.error.message);
        return { ok:true };
      });
    }

    if(a==='updateJobDocs'){
      var patch={ updated_at:new Date().toISOString() };
      ['pr','po','rc','note'].forEach(function(k){ if(pl[k]!==undefined) patch[k]=pl[k]; });
      if(pl.partsDetail!==undefined) patch.parts_detail=pl.partsDetail;
      if(pl.waitDetail !==undefined) patch.wait_detail =pl.waitDetail;
      if(pl.waitMinutes!==undefined) patch.wait_minutes=+pl.waitMinutes||0;
      if(pl.costParts   !==undefined) patch.cost_parts   =+pl.costParts||0;
      if(pl.costInternal!==undefined) patch.cost_internal=+pl.costInternal||0;
      if(pl.costExternal!==undefined) patch.cost_external=+pl.costExternal||0;
      return db.from('jobs').update(patch).eq('id', pl.jobId||pl.id).select().single()
        .then(function(r){
          if(r.error) throw new Error('DATA|'+r.error.message);
          _cacheRaw={};
          return { ok:true, waitMinutes:(r.data&&r.data.wait_minutes)||0 };
        });
    }

    if(a==='login'){
      var eid=String(pl.empid||'').trim();
      if(['1009999','9000001'].indexOf(eid)>=0)
        return { ok:false, error:'รหัสนี้เป็นตัวอย่างรูปแบบ ใช้เข้าระบบไม่ได้' };
      return db.from('users')
        .select('emp_id,full_name,phone,role,position,pool,role_th,docs_editor,password_hash')
        .eq('emp_id', eid).limit(1)
        .then(function(r){
          if(r.error) throw new Error('DATA|'+r.error.message);
          var u=(r.data||[])[0];
          if(!u) return { ok:false, error:'ไม่พบรหัสพนักงานนี้' };
          if(u.password_hash && u.password_hash !== String(pl.password||''))
            return { ok:false, error:'รหัสผ่านไม่ถูกต้อง' };
          return { ok:true, user:{ empid:u.emp_id, name:u.full_name, phone:u.phone||'',
            role:u.role||'user', position:u.position||'', pool:u.pool||'',
            roleTh:u.role_th||'', docsEditor:!!u.docs_editor } };
        });
    }

    return { ok:false, error:'ยังไม่รองรับคำสั่ง: '+a };
  });
}

  jobType:'job_type', problemType:'problem_type', problemDetail:'problem_detail',
  image1:'image1', image2:'image2', doneImage1:'done_image1', doneImage2:'done_image2',

  assignedTo:'assigned_to', assignedName:'assigned_name', planDays:'plan_days',
  planHours:'plan_hours', repairDetail:'repair_detail', partsDetail:'parts_detail',
  pr:'pr', po:'po', rc:'rc', costParts:'cost_parts', costInternal:'cost_internal',
  costExternal:'cost_external', note:'note', waitMinutes:'wait_minutes',
  waitDetail:'wait_detail', createdBy:'created_by', createdName:'created_name',
  createdAt:'created_at', updatedBy:'updated_by', updatedAt:'updated_at',
  assignedAt:'assigned_at', acceptedBy:'accepted_by', acceptedAt:'accepted_at',
  reassignedAt:'reassigned_at', doneAt:'done_at', closedAt:'closed_at' };
function _jobOut(row){
  var o={}; Object.keys(_JOBMAP_D).forEach(function(k){
    var v=row[_JOBMAP_D[k]]; o[k]=(v===undefined?null:v); });
  return o;
}

function call(payload){
  var pl=Object.assign({action:'getDashboardData'},payload||{});
  if(pl.range && /^(1|3|6|12)m$/.test(pl.range)){ pl.months=parseInt(pl.range,10); }
  /* ประตูออกหลังบ้านจุดเดียวของทั้งหน้า — สลับปลายทางตรงนี้ที่เดียว */
  if(BACKEND==='supabase'){
    return Promise.resolve().then(function(){ return _handle(pl); })
      .then(function(j){
        if(!j || !j.ok) throw new Error('DATA|'+((j&&j.error)||'ตอบกลับผิดปกติ'));
        return j;
      });
  }
  return callGAS(pl);
}
function callGAS(pl){
  return fetch(API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(pl), redirect:'follow' })
    .then(function(r){ if(!r.ok) throw new Error('NETWORK|เชื่อมต่อไม่ได้ (HTTP '+r.status+')'); return r.json(); })
    .then(function(j){ if(!j || !j.ok) throw new Error('DATA|'+((j&&j.error)||'ตอบกลับผิดปกติ')); return j; });
}
function fmtMin(m){ if(!m) return '-'; var h=Math.floor(m/60), mm=m%60; if(h===0) return mm+' นาที'; return h+' ชม.'+(mm?' '+mm+'น.':''); }
function fmtBaht(n){ n=Math.round(n||0); return '฿'+n.toLocaleString('th-TH'); }
function monthLabel(k){ var p=k.split('-'); return ['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][+p[1]]+' '+String(+p[0]+543).slice(2); }
function destroyCharts(){ CHARTS.forEach(function(c){try{c.destroy()}catch(e){}}); CHARTS=[]; }
function rangeLabel(){ return (DATA&&DATA.range&&DATA.range.label) || 'วันนี้'; }
function setR(r){ RANGE=r; document.querySelectorAll('.rangebtn').forEach(function(b){b.classList.toggle('active', b.dataset.r===r)}); load(); }
function setPool(v){ POOL=v; load(); }
function showTab(t){ TAB=t; document.querySelectorAll('.nav').forEach(function(x){x.classList.toggle('active', x.dataset.t===t)});
  document.getElementById('tabName').textContent = t==='pm'?'ภาพรวมงาน PM':(t==='repair'?'ภาพรวมงานแจ้งซ่อม':(t==='machines'?'รายเครื่องจักร':(t==='docs'?'จัดการเอกสาร PR-PO':'ตั้งค่า')));
  if(t==='machines'){ if(DATA && DATA.machineTab){ render(); } else { load(); } return; }
  render(); }
function kpi(tint,cl,ico,val,valcl,label){ return '<div class="kpi"><div class="ico '+tint+' '+cl+'">'+ico+'</div><div><div class="v '+valcl+'">'+val+'</div><div class="l">'+label+'</div></div></div>'; }
function updatePools(){ var sel=document.getElementById('poolSel'); if(!sel||!DATA||!DATA.pools) return; var ps=DATA.pools||[];
  sel.innerHTML='<option value="">ทุก Pool</option>'+ps.map(function(p){ return '<option value="'+escapeHtml(p)+'"'+(p===POOL?' selected':'')+'>'+escapeHtml(p)+'</option>'; }).join(''); sel.value=POOL; }
function setLoading(on){ var b=document.getElementById('body'); if(b){ b.style.opacity=on?'0.45':'1'; b.style.pointerEvents=on?'none':'auto'; } }
function dataSaved(){ try{ var s=_lsGet('skmk_data'); return s?JSON.parse(s):null; }catch(e){ return null; } }
function dataSave(d){ try{ _lsSet('skmk_data', JSON.stringify(d)); }catch(e){} }
function stampMeta(kind){ var g=(DATA&&DATA.generatedAt)||''; var me=document.getElementById('meta'); if(me) me.textContent=(kind==='live'?'ข้อมูลสด ':'ข้อมูลที่บันทึกไว้ ')+g+' · ช่วง '+rangeLabel()+(POOL?(' · Pool '+POOL):''); var ft=document.getElementById('foot'); if(ft) ft.textContent=(kind==='live'?'สดล่าสุด ':'ข้อมูล ')+g; }
function load(bg){
  var key=ckey();
  if(CACHE[key]){ DATA=CACHE[key]; if(TAB!=='settings'&&TAB!=='docs'){ render(); updatePools(); } stampMeta('live'); }
  else { if(!DATA) DATA=dataSaved()||EMBEDDED_DATA; if(DATA&&TAB!=='settings'&&TAB!=='docs'){ render(); updatePools(); } stampMeta(_lsGet('skmk_live')==='1'?'live':'saved'); }
  if(!bg) setLoading(true);
  call({ range:RANGE, pool:POOL, machines:wantM() }).then(function(r){
    setLoading(false);
    if(!r||!r.ok) return;
    if(ckey()!==key) return;
    CACHE[key]=r; DATA=r; dataSave(r); _lsSet('skmk_live','1'); stampMeta('live');
    if(TAB!=='settings'&&TAB!=='docs'){ render(); updatePools(); }
  }).catch(function(){ setLoading(false); });
}
function render(){
  if(TAB==='settings'){ destroyCharts(); renderSettings(); return; }
  if(TAB==='machines'){ destroyCharts(); renderMachines(); return; }
  if(TAB==='docs'){ destroyCharts(); renderDocs(); return; }
  if(!DATA){ destroyCharts(); document.getElementById('body').innerHTML='<div class="loading">กำลังโหลดข้อมูล…</div>'; return; }
  var sig=TAB+'|'+RANGE+'|'+POOL+'|'+JSON.stringify(DATA.pm)+'|'+JSON.stringify(DATA.repair);
  if(sig===LAST_SIG) return;   /* ข้อมูลไม่เปลี่ยน → ไม่วาดใหม่ (กันกระพริบ auto-refresh) */
  LAST_SIG=sig; destroyCharts();

/* v3.19: บันทึกภาพให้ออกได้ทั้งมือถือและ PC
   - PC: ดาวน์โหลดไฟล์ตรง (a.download)
   - มือถือ/in-app webview: เปิด overlay ให้ "กดค้างที่รูปเพื่อบันทึก" + ปุ่มแชร์ (navigator.share ภายใน click = มี user activation ถูกต้อง) + ลิงก์ดาวน์โหลดสำรอง */
/* v3.19: จำกัด scale ไม่ให้ canvas ใหญ่เกินลิมิต webview/iOS (กันแอปแครชตอนบันทึกภาพ) */
function _safeCanvasScale(w,h,pref){
  var isMobile=/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent||'');
  var s=isMobile?Math.min(pref,2):pref;
  var W=(w||1),H=(h||1),maxSide=4000,maxTotal=16000000;
  s=Math.min(s, maxSide/Math.max(W,H), Math.sqrt(maxTotal/(W*H)));
  return (s>0&&isFinite(s))?s:1;
}
function _saveCanvasImage(canvas, filename){
  var isMobile=/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent||'');
  /* v3.19: ใช้ toBlob + objectURL (เบามาก) แทน toDataURL (base64 มหึมา → webview แครช) */
  function withUrl(cb){
    try{ if(canvas.toBlob){ canvas.toBlob(function(b){ cb(b?URL.createObjectURL(b):'', b, true); }, 'image/png'); return; } }catch(e){}
    try{ cb(canvas.toDataURL('image/png'), null, false); }catch(e){ cb('', null, false); }
  }
  withUrl(function(url, blob, isObj){
    if(!url){ alert('สร้างรูปไม่สำเร็จ ลองใหม่'); return; }
    if(!isMobile){
      try{ var a=document.createElement('a'); a.download=filename; a.href=url; document.body.appendChild(a); a.click(); document.body.removeChild(a); }catch(e){}
      if(isObj) setTimeout(function(){ try{URL.revokeObjectURL(url);}catch(e){} }, 10000);
      return;
    }
    var ov=document.createElement('div');
    ov.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px;overflow:auto';
    var shareBtn=(navigator.share)?'<button id="_imShare" style="background:#25A56A;color:#fff;padding:10px 18px;border-radius:9px;border:none;font-weight:800;font-size:.9rem">📤 แชร์ / บันทึกภาพ</button>':'';
    ov.innerHTML='<div style="color:#fff;font-size:.86rem;text-align:center;max-width:340px;line-height:1.6">📷 <b>กดค้างที่รูป</b> เพื่อบันทึกลงเครื่อง'+(shareBtn?'<br>หรือกดปุ่ม “แชร์ / บันทึกภาพ”':'')+'</div>'+
      '<img src="'+url+'" style="max-width:100%;max-height:62vh;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.5)">'+
      '<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">'+shareBtn+
      '<a href="'+url+'" download="'+filename+'" style="background:#1565C0;color:#fff;padding:10px 18px;border-radius:9px;text-decoration:none;font-weight:800;font-size:.9rem">⬇ ดาวน์โหลด</a>'+
      '<button id="_imClose" style="background:#fff;color:#333;padding:10px 18px;border-radius:9px;border:none;font-weight:800;font-size:.9rem">ปิด</button></div>';
    document.body.appendChild(ov);
    function closeOv(){ if(ov.parentNode) ov.parentNode.removeChild(ov); if(isObj) setTimeout(function(){ try{URL.revokeObjectURL(url);}catch(e){} }, 800); }
    ov.querySelector('#_imClose').onclick=closeOv;
    var sb=ov.querySelector('#_imShare');
    if(sb){ sb.onclick=function(){
      try{
        var doShare=function(file){
          if(file && navigator.canShare && navigator.canShare({files:[file]})){ navigator.share({files:[file], title:filename}).catch(function(){}); }
          else { navigator.share({title:filename, text:filename}).catch(function(){}); }
        };
        if(blob){ doShare(new File([blob], filename, {type:'image/png'})); }
        else if(canvas.toBlob){ canvas.toBlob(function(b){ doShare(b?new File([b], filename, {type:'image/png'}):null); }, 'image/png'); }
        else { navigator.share({title:filename, text:filename}).catch(function(){}); }
      }catch(e){}
    }; }
  });
}
