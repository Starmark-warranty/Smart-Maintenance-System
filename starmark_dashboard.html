<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#1565C0">
<title>STARMARK — Dashboard (Supabase)</title>
<!--═══════════════════════════════════════════════════════════════════════
  STARMARK Dashboard v2.0 — ต่อ Supabase โดยตรง
  ───────────────────────────────────────────────────────────────────────
  แทนที่ตัวเดิมที่ยิงไป Apps Script ผ่าน JSONP (doGet?action=getDashboardData)
  ตัวนี้อ่านจาก Postgres ตรง ๆ จึงเร็วกว่าและไม่ติดเพดาน 30 executions

  ใช้ได้ 2 ทาง:
    1. ฝังใน Index_v19_supabase.html ผ่านปุ่ม "แดชบอร์ด" (iframe)
       -> ต้องวางไฟล์นี้ไว้โฟลเดอร์เดียวกับ Index
    2. เปิดตรง ๆ บนคอม (ดับเบิลคลิก) ก็ได้ ไม่ต้องมี Index
═══════════════════════════════════════════════════════════════════════-->
<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap');
:root{
  --p:#1565C0; --pd:#0D47A1; --pl:#E3F2FD;
  --gn:#2E7D32; --gnl:#E8F5E9;
  --rd:#E53935; --rdl:#FFEBEE;
  --am:#FB8C00; --aml:#FFF3E0;
  --gy:#607D8B; --gyl:#ECEFF1;
  --ink:#1A237E; --sub:#546E7A; --mut:#90A4AE;
  --bg:#EEF1F6; --card:#fff; --line:#E3E8EF;
  --r:16px; --sh:0 2px 10px rgba(0,0,0,.07); --sh2:0 4px 18px rgba(0,0,0,.10);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:'IBM Plex Sans Thai','Kanit',sans-serif;
  background:var(--bg); color:#212121; font-size:15px;
  -webkit-font-smoothing:antialiased; padding-bottom:40px;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px}

/* ── header ── */
.hd{background:linear-gradient(135deg,#0D47A1,#1565C0 60%,#1976D2);color:#fff;padding:16px 0 22px;margin-bottom:-14px}
.hd-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hd-logo{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.hd-t{font-family:'Kanit',sans-serif;font-size:1.15rem;font-weight:800;letter-spacing:.02em}
.hd-s{font-size:.72rem;color:rgba(255,255,255,.72);margin-top:1px}
/* ป้ายสถานะ — ล็อกความสูงและความกว้างตายตัว
   ของเดิมปล่อยให้ flex คำนวณเอง แล้วบวมเป็นวงกลมใหญ่ */
.hd-live{
  margin-left:auto; flex:0 0 auto;
  display:inline-flex; align-items:center; gap:7px;
  height:26px; padding:0 12px; box-sizing:border-box;
  background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.24);
  border-radius:13px;
  font-size:.7rem; font-weight:700; line-height:1;
  white-space:nowrap; overflow:hidden; max-width:190px;
}
#live-txt{ overflow:hidden; text-overflow:ellipsis; line-height:1 }
.dot{
  flex:0 0 8px; width:8px; height:8px;
  min-width:8px; max-width:8px; min-height:8px; max-height:8px;
  border-radius:50%; background:#A5D6A7; align-self:center;
}
.dot.off { background:#EF9A9A }
.dot.load{ background:#FFD54F; animation:pulse .9s ease-in-out infinite }
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ── tabs ── */
.tabs{display:flex;gap:6px;background:var(--card);border-radius:14px;padding:6px;box-shadow:var(--sh);margin:20px 0 14px;overflow-x:auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:110px;border:none;background:none;font-family:inherit;font-size:.85rem;font-weight:700;color:var(--sub);
  padding:10px 12px;border-radius:10px;cursor:pointer;white-space:nowrap;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px}
.tab:hover{background:#F5F7FA}
.tab.on{background:var(--p);color:#fff;box-shadow:0 2px 8px rgba(21,101,192,.3)}

/* ── filters ── */
.flt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
select.f{font-family:inherit;font-size:.82rem;font-weight:600;color:var(--ink);background:var(--card);
  border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;outline:none;min-width:130px}
select.f:focus{border-color:var(--p)}
.rng{display:flex;gap:4px;background:var(--card);border-radius:10px;padding:4px;box-shadow:var(--sh);flex-wrap:wrap}
.rb{border:none;background:none;font-family:inherit;font-size:.78rem;font-weight:700;color:var(--sub);
  padding:7px 13px;border-radius:8px;cursor:pointer;transition:all .15s;white-space:nowrap}
.rb:hover{background:#F5F7FA}
.rb.on{background:var(--p);color:#fff}
.rfr{margin-left:auto;border:1.5px solid var(--line);background:var(--card);border-radius:10px;
  padding:8px 14px;font-family:inherit;font-size:.8rem;font-weight:700;color:var(--p);cursor:pointer}
.rfr:hover{background:var(--pl)}
.rfr:disabled{opacity:.5;cursor:wait}

/* ── section ── */
.sec{font-family:'Kanit',sans-serif;font-size:1.02rem;font-weight:800;color:var(--ink);margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.sec small{font-size:.72rem;font-weight:500;color:var(--mut);font-family:'IBM Plex Sans Thai',sans-serif}

/* ── kpi ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--sh);display:flex;align-items:center;gap:13px;
  border:1px solid rgba(0,0,0,.03);transition:transform .12s,box-shadow .12s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.kpi-i{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:1.35rem;flex-shrink:0}
.kpi-v{font-family:'Kanit',sans-serif;font-size:1.75rem;font-weight:900;line-height:1;letter-spacing:-.02em}
.kpi-l{font-size:.73rem;color:var(--sub);font-weight:600;margin-top:4px;line-height:1.35}
.c-p .kpi-i{background:var(--pl)}   .c-p .kpi-v{color:var(--p)}
.c-g .kpi-i{background:var(--gnl)}  .c-g .kpi-v{color:var(--gn)}
.c-r .kpi-i{background:var(--rdl)}  .c-r .kpi-v{color:var(--rd)}
.c-a .kpi-i{background:var(--aml)}  .c-a .kpi-v{color:var(--am)}
.c-y .kpi-i{background:var(--gyl)}  .c-y .kpi-v{color:var(--gy)}

/* ── card / bar ── */
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--sh);border:1px solid rgba(0,0,0,.03)}
.bar-hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;font-size:.83rem;font-weight:700;color:var(--ink);flex-wrap:wrap;gap:6px}
.bar-hd b{font-size:1.05rem;color:var(--p);font-family:'Kanit',sans-serif}
.bar{height:11px;background:#E8EDF3;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#42A5F5,#1565C0);transition:width .5s cubic-bezier(.4,0,.2,1)}
.bar.g>i{background:linear-gradient(90deg,#66BB6A,#2E7D32)}
.bar.a>i{background:linear-gradient(90deg,#FFB74D,#EF6C00)}

/* ── status pills ── */
.pills{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:9px}
.pill{border-radius:13px;padding:13px 8px;text-align:center;border:1px solid rgba(0,0,0,.04)}
.pill-v{font-family:'Kanit',sans-serif;font-size:1.5rem;font-weight:900;line-height:1}
.pill-l{font-size:.68rem;font-weight:700;margin-top:4px}
.p-n{background:var(--gnl)} .p-n .pill-v{color:#2E7D32} .p-n .pill-l{color:#1B5E20}
.p-b{background:var(--rdl)} .p-b .pill-v{color:#C62828} .p-b .pill-l{color:#B71C1C}
.p-r{background:var(--aml)} .p-r .pill-v{color:#E65100} .p-r .pill-l{color:#BF360C}
.p-i{background:var(--gyl)} .p-i .pill-v{color:#546E7A} .p-i .pill-l{color:#37474F}
.p-m{background:#FFF8E1}    .p-m .pill-v{color:#F57F17} .p-m .pill-l{color:#E65100}

/* ── table ── */
.tw{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;border:1px solid rgba(0,0,0,.03)}
.tsc{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th{background:#F7F9FC;color:var(--sub);font-weight:700;font-size:.72rem;text-align:left;padding:11px 12px;
  white-space:nowrap;border-bottom:1.5px solid var(--line);position:sticky;top:0}
td{padding:10px 12px;border-bottom:1px solid #F2F5F9;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#FAFCFF}
.num{text-align:right;font-family:'Kanit',sans-serif;font-weight:700}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:.74rem;color:#455A64;white-space:nowrap}
.tag{display:inline-block;border-radius:8px;padding:3px 9px;font-size:.68rem;font-weight:800;white-space:nowrap}
.t-n{background:var(--gnl);color:#1B5E20} .t-b{background:var(--rdl);color:#B71C1C}
.t-r{background:var(--aml);color:#BF360C} .t-i{background:var(--gyl);color:#37474F}
.t-p{background:var(--pl);color:var(--pd)} .t-m{background:#FFF8E1;color:#E65100}

/* ── pool group ── */
.pg{margin-bottom:11px;border-radius:13px;overflow:hidden;box-shadow:var(--sh)}
.pg-h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;
  background:linear-gradient(90deg,#1565C0,#1976D2);color:#fff}
.pg-n{font-size:.86rem;font-weight:800;display:flex;align-items:center;gap:7px}
.pg-c{background:rgba(255,255,255,.24);border-radius:99px;padding:3px 12px;font-size:.72rem;font-weight:800}
.pg-b{background:var(--card);padding:5px 0}
.pg-r{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid #F2F5F9;font-size:.8rem}
.pg-r:last-child{border-bottom:none}
.pg-i{width:23px;height:23px;border-radius:7px;background:var(--aml);color:#E65100;
  display:flex;align-items:center;justify-content:center;font-size:.66rem;font-weight:800;flex-shrink:0}
.pg-nm{flex:1;min-width:0;color:#212121;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── misc ── */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px}
.empty{text-align:center;padding:44px 20px;color:var(--mut)}
.empty .ei{font-size:2.4rem;margin-bottom:10px;opacity:.65}
.empty .et{font-size:.9rem;font-weight:700;color:var(--sub)}
.load{text-align:center;padding:52px 20px;color:var(--mut)}
.spin{width:34px;height:34px;border:3px solid #E3E8EF;border-top-color:var(--p);border-radius:50%;
  animation:sp .7s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{background:var(--rdl);border:1.5px solid #EF9A9A;border-radius:var(--r);padding:16px;color:#B71C1C;font-size:.85rem;line-height:1.6}
.err b{display:block;font-size:.95rem;margin-bottom:5px}
.hide{display:none!important}
.srch{font-family:inherit;font-size:.82rem;border:1.5px solid var(--line);border-radius:10px;
  padding:8px 12px;outline:none;min-width:190px;flex:1;max-width:290px}
.srch:focus{border-color:var(--p)}
@media(max-width:640px){
  .kpi-v{font-size:1.5rem} .hd-t{font-size:1rem} .tab{min-width:88px;font-size:.78rem;padding:9px 6px}
  .rfr{margin-left:0;width:100%}
}
</style>
</head>
<body>

<div class="hd">
  <div class="wrap hd-in">
    <div class="hd-logo">📊</div>
    <div>
      <div class="hd-t">STARMARK Dashboard</div>
      <div class="hd-s" id="hd-sub">กำลังเชื่อมต่อ…</div>
    </div>
    <div class="hd-live"><span class="dot load" id="live-dot"></span><span id="live-txt">กำลังต่อ…</span></div>
  </div>
</div>

<div class="wrap">
  <div class="tabs">
    <button class="tab on" data-tab="pm"     onclick="Dash.tab('pm')">🔧 งาน PM</button>
    <button class="tab"    data-tab="repair" onclick="Dash.tab('repair')">🛠️ งานแจ้งซ่อม</button>
    <button class="tab"    data-tab="mach"   onclick="Dash.tab('mach')">🏭 เครื่องจักร</button>
  </div>

  <div class="flt">
    <select class="f" id="f-pool" onchange="Dash.load()"><option value="">ทุก Pool</option></select>
    <div class="rng" id="f-range"></div>
    <button class="rfr" id="btn-rfr" onclick="Dash.load(true)">↻ รีเฟรช</button>
  </div>

  <div id="body"><div class="load"><div class="spin"></div><div>กำลังโหลดข้อมูล…</div></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';

/* ════════ ตั้งค่า ════════ */
const SB_URL = 'https://lktiusfceceywpkzuqaq.supabase.co';
const SB_KEY = 'sb_publishable_4L3fWwfb2zvU1wWDO9g4nQ_tloXtUpS';

const RANGES = [
  {k:'today', l:'วันนี้', d:0},
  {k:'7d',    l:'7 วัน',  d:7},
  {k:'1m',    l:'1 ด.',   d:30},
  {k:'3m',    l:'3 ด.',   d:90},
  {k:'6m',    l:'6 ด.',   d:180},
  {k:'1y',    l:'1 ปี',   d:365},
];

const Dash = (() => {
  let db = null, cur = 'pm', range = '1m', cache = null;

  /* ── ตัวช่วย ── */
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const $ = id => document.getElementById(id);

  /* วันที่ไทยวันนี้ — ไม่อิง timezone เครื่อง (เครื่องพนักงานอาจตั้งเป็นเมียนมา/UTC) */
  const todayTH = () => new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'});
  const daysAgo = n => { const d=new Date(); d.setDate(d.getDate()-n);
    return d.toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'}); };
  const fmtTH = s => { if(!s) return '—'; const [y,m,d]=String(s).split('-');
    return `${d}/${m}/${(+y)+543}`; };

  /* Pool จาก line: "1_MP322" -> "MP322" */
  function poolOf(line){
    const s = String(line||'').trim(); if(!s) return 'ไม่ระบุ';
    const m = s.match(/_([A-Za-z]*\d+)\s*$/);
    return m ? m[1].toUpperCase() : s.toUpperCase();
  }

  /* PostgREST คืนได้สูงสุด 1000 แถวต่อครั้ง — ต้องวนดึงเป็นหน้า
     ไม่งั้นช่วง 6 เดือน/1 ปี จะได้ข้อมูลไม่ครบโดยไม่มี error เตือน */
  async function all(build){
    const SIZE = 1000; let out = [], from = 0;
    for(let i=0;i<200;i++){
      const { data, error } = await build().range(from, from+SIZE-1);
      if(error) throw error;
      out = out.concat(data||[]);
      if(!data || data.length < SIZE) break;
      from += SIZE;
      setLive('load', out.length.toLocaleString() + ' แถว…');
    }
    return out;
  }

  function setLive(state, txt){
    const d=$('live-dot'), t=$('live-txt');
    if(d) d.className = 'dot' + (state==='ok'?'':state==='load'?' load':' off');
    if(t) t.textContent = txt;
  }

  async function ready(){
    if(db) return db;
    if(!window.supabase) throw new Error('โหลด supabase-js ไม่ได้ — ตรวจอินเทอร์เน็ต');
    db = window.supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:false}});
    return db;
  }

  /* ════════ ดึงข้อมูล ════════ */
  async function fetchAll(){
    const d = await ready();
    const today = todayTH();
    const days  = (RANGES.find(r=>r.k===range)||{d:30}).d;
    const from  = days ? daysAgo(days) : today;
    const pool  = $('f-pool').value;

    setLive('load','กำลังโหลด…');

    const [mach, pm, jobs] = await Promise.all([
      all(()=> d.from('machines')
            .select('id,line,name,status').order('id')),
      all(()=> d.from('pm_records')
            .select('id,pm_date,pm_time,machine_id,line,machine_name,machine_status,inspector_name')
            .gte('pm_date', from).order('pm_date',{ascending:false})),
      all(()=> d.from('jobs')
            .select('id,asset_id,line,machine_name,status,problem_type,created_at,done_at,closed_at,assigned_name,cost_parts,cost_internal,cost_external')
            .gte('created_at', from+'T00:00:00').order('created_at',{ascending:false})),
    ]);

    /* กรอง Pool (ทำฝั่ง client เพราะ pool ต้องแกะจาก line) */
    const inPool = ln => !pool || poolOf(ln) === pool;
    const active = mach.filter(m => m.status === 'active' && inPool(m.line));
    const machIds = new Set(active.map(m=>m.id));

    return {
      today, from, days, pool,
      machines: active,
      forSale : mach.filter(m => m.status !== 'active' && inPool(m.line)).length,
      pm      : pm.filter(r => machIds.has(r.machine_id)),
      jobs    : jobs.filter(j => !pool || inPool(j.line)),
      allPools: [...new Set(mach.map(m=>poolOf(m.line)))].sort(),
    };
  }

  /* ════════ แท็บ 1: งาน PM ════════ */
  function viewPM(x){
    const total = x.machines.length;
    const todayRec = x.pm.filter(r => r.pm_date === x.today);

    /* เครื่องที่ทำ PM วันนี้ (นับซ้ำเป็นครั้งเดียว) */
    const doneToday = new Set(todayRec.map(r=>r.machine_id));
    const pct = total ? Math.round(doneToday.size*100/total) : 0;

    /* ครอบคลุมทั้งช่วง */
    const coverSet = new Set(x.pm.map(r=>r.machine_id));
    const coverPct = total ? Math.round(coverSet.size*100/total) : 0;

    /* สถานะเครื่องจากผล PM ล่าสุดของวันนี้ */
    const st = {normal:0,broken:0,repair:0,idle:0};
    const latest = {};
    todayRec.forEach(r => { if(!latest[r.machine_id]) latest[r.machine_id] = r.machine_status||'normal'; });
    Object.values(latest).forEach(v => { st[v]!==undefined ? st[v]++ : st.normal++; });

    /* เครื่องที่ยังไม่ได้ทำวันนี้ แยกตาม Pool */
    const missed = x.machines.filter(m => !doneToday.has(m.id));
    const byPool = {};
    missed.forEach(m => (byPool[poolOf(m.line)] ||= []).push(m));
    const pools = Object.keys(byPool).sort((a,b)=>a.localeCompare(b,'en',{numeric:true}));

    /* ผู้ตรวจสอบสูงสุด */
    const byTech = {};
    x.pm.forEach(r => { const n=(r.inspector_name||'').trim(); if(n) byTech[n]=(byTech[n]||0)+1; });
    const techs = Object.entries(byTech).sort((a,b)=>b[1]-a[1]).slice(0,10);

    const rl = RANGES.find(r=>r.k===range).l;

    return `
      <div class="sec">📊 ภาพรวมงาน PM <small>ข้อมูลสด ${new Date().toLocaleString('th-TH',{timeZone:'Asia/Bangkok',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})} · ช่วง ${rl}</small></div>
      <div class="kpis">
        <div class="kpi c-p"><div class="kpi-i">📋</div><div><div class="kpi-v">${pct}%</div><div class="kpi-l">PM Compliance (วันนี้)</div></div></div>
        <div class="kpi c-y"><div class="kpi-i">🏭</div><div><div class="kpi-v">${total}</div><div class="kpi-l">เครื่องทั้งหมด${x.forSale?` · รอขาย ${x.forSale}`:''}</div></div></div>
        <div class="kpi c-g"><div class="kpi-i">✅</div><div><div class="kpi-v">${doneToday.size}</div><div class="kpi-l">ทำ PM วันนี้</div></div></div>
        <div class="kpi c-a"><div class="kpi-i">⏳</div><div><div class="kpi-v">${missed.length}</div><div class="kpi-l">ยังไม่ได้ทำวันนี้</div></div></div>
      </div>

      <div class="card" style="margin-top:12px">
        <div class="bar-hd"><span>ทำ PM ครอบคลุม (ช่วง ${rl}) : <b>${coverSet.size}/${total}</b> เครื่อง</span><b>${coverPct}%</b></div>
        <div class="bar g"><i style="width:${coverPct}%"></i></div>
        <div style="margin-top:6px;font-size:.73rem;color:var(--mut)">บันทึก PM ทั้งหมดในช่วง ${x.pm.length.toLocaleString()} รายการ</div>
      </div>

      <div class="sec">🔎 สถานะเครื่องจากผล PM วันนี้</div>
      <div class="pills">
        <div class="pill p-n"><div class="pill-v">${st.normal}</div><div class="pill-l">ปกติ</div></div>
        <div class="pill p-b"><div class="pill-v">${st.broken}</div><div class="pill-l">เสีย / ซ่อมทันที</div></div>
        <div class="pill p-r"><div class="pill-v">${st.repair}</div><div class="pill-l">ซ่อมบำรุง</div></div>
        <div class="pill p-i"><div class="pill-v">${st.idle}</div><div class="pill-l">ไม่ได้ใช้งาน</div></div>
        <div class="pill p-m"><div class="pill-v">${missed.length}</div><div class="pill-l">ยังไม่ได้ทำ PM</div></div>
      </div>

      <div class="grid2" style="margin-top:6px">
        <div>
          <div class="sec">🔴 เครื่องที่ยังไม่ได้ทำ PM วันนี้ <small>${missed.length} เครื่อง</small></div>
          ${missed.length ? pools.map(p=>`
            <div class="pg">
              <div class="pg-h"><div class="pg-n">📍 ${esc(p)}</div><div class="pg-c">${byPool[p].length} เครื่อง</div></div>
              <div class="pg-b">${byPool[p].map((m,i)=>`
                <div class="pg-r">
                  <div class="pg-i">${i+1}</div>
                  <span class="mono">${esc(m.id)}</span>
                  <div class="pg-nm">${esc(m.name||'')}</div>
                </div>`).join('')}</div>
            </div>`).join('')
          : `<div class="card empty"><div class="ei">🎉</div><div class="et">ทำ PM ครบทุกเครื่องแล้ววันนี้</div></div>`}
        </div>
        <div>
          <div class="sec">🏅 ผู้ตรวจสอบสูงสุด <small>ช่วง ${rl}</small></div>
          ${techs.length ? `<div class="tw"><div class="tsc"><table>
            <thead><tr><th>#</th><th>ชื่อผู้ตรวจ</th><th class="num">จำนวน PM</th></tr></thead>
            <tbody>${techs.map((t,i)=>`<tr>
              <td class="mono">${i+1}</td><td>${esc(t[0])}</td>
              <td class="num" style="color:var(--p)">${t[1].toLocaleString()}</td></tr>`).join('')}
            </tbody></table></div></div>`
          : `<div class="card empty"><div class="ei">📋</div><div class="et">ยังไม่มีบันทึก PM ในช่วงนี้</div></div>`}
        </div>
      </div>`;
  }

  /* ════════ แท็บ 2: งานแจ้งซ่อม ════════ */
  function viewRepair(x){
    const J = x.jobs;
    const OPEN = ['new','waiting','assigned','working','pending_confirm'];
    const cnt = k => J.filter(j=>j.status===k).length;
    const open = J.filter(j=>OPEN.includes(j.status)).length;
    const closed = J.filter(j=>j.status==='closed'||j.status==='done').length;
    const cost = J.reduce((s,j)=> s+(+j.cost_parts||0)+(+j.cost_internal||0)+(+j.cost_external||0), 0);

    /* เครื่องที่แจ้งซ่อมบ่อย */
    const byM = {};
    J.forEach(j=>{ const a=(j.asset_id||'').trim(); if(a){ (byM[a] ||= {n:0,name:j.machine_name,line:j.line}); byM[a].n++; } });
    const top = Object.entries(byM).sort((a,b)=>b[1].n-a[1].n).slice(0,12);

    /* ประเภทปัญหา */
    const byT = {};
    J.forEach(j=>{ const t=(j.problem_type||'ไม่ระบุ').trim(); byT[t]=(byT[t]||0)+1; });
    const types = Object.entries(byT).sort((a,b)=>b[1]-a[1]).slice(0,10);
    const maxT = types.length ? types[0][1] : 1;

    const LBL = {new:'ใหม่',waiting:'รอรับงาน',assigned:'จ่ายงานแล้ว',working:'กำลังซ่อม',
                 pending_confirm:'รอยืนยัน',closed:'ปิดงาน',done:'เสร็จ',cancelled:'ยกเลิก'};
    const rl = RANGES.find(r=>r.k===range).l;

    return `
      <div class="sec">🛠️ ภาพรวมงานแจ้งซ่อม <small>ช่วง ${rl}</small></div>
      <div class="kpis">
        <div class="kpi c-p"><div class="kpi-i">📄</div><div><div class="kpi-v">${J.length}</div><div class="kpi-l">งานทั้งหมด</div></div></div>
        <div class="kpi c-a"><div class="kpi-i">⚠️</div><div><div class="kpi-v">${open}</div><div class="kpi-l">ยังไม่ปิดงาน</div></div></div>
        <div class="kpi c-g"><div class="kpi-i">✅</div><div><div class="kpi-v">${closed}</div><div class="kpi-l">ปิดงานแล้ว</div></div></div>
        <div class="kpi c-r"><div class="kpi-i">💰</div><div><div class="kpi-v">฿${Math.round(cost).toLocaleString()}</div><div class="kpi-l">ค่าใช้จ่ายรวม</div></div></div>
      </div>

      <div class="sec">📌 แยกตามสถานะ</div>
      <div class="pills">
        <div class="pill p-m"><div class="pill-v">${cnt('waiting')+cnt('new')}</div><div class="pill-l">รอรับงาน</div></div>
        <div class="pill p-r"><div class="pill-v">${cnt('assigned')}</div><div class="pill-l">จ่ายงานแล้ว</div></div>
        <div class="pill p-b"><div class="pill-v">${cnt('working')}</div><div class="pill-l">กำลังซ่อม</div></div>
        <div class="pill p-n"><div class="pill-v">${cnt('pending_confirm')}</div><div class="pill-l">รอยืนยัน</div></div>
        <div class="pill p-i"><div class="pill-v">${closed}</div><div class="pill-l">ปิดงาน</div></div>
      </div>

      <div class="grid2" style="margin-top:6px">
        <div>
          <div class="sec">🔧 เครื่องที่แจ้งซ่อมบ่อย</div>
          ${top.length ? `<div class="tw"><div class="tsc"><table>
            <thead><tr><th>รหัสเครื่อง</th><th>ชื่อเครื่อง</th><th class="num">ครั้ง</th></tr></thead>
            <tbody>${top.map(([id,v])=>`<tr>
              <td class="mono">${esc(id)}</td>
              <td>${esc(v.name||'')}<div style="font-size:.68rem;color:var(--mut)">${esc(v.line||'')}</div></td>
              <td class="num" style="color:var(--rd)">${v.n}</td></tr>`).join('')}
            </tbody></table></div></div>`
          : `<div class="card empty"><div class="ei">✨</div><div class="et">ไม่มีงานแจ้งซ่อมในช่วงนี้</div></div>`}
        </div>
        <div>
          <div class="sec">📊 ประเภทปัญหาที่พบบ่อย</div>
          ${types.length ? `<div class="card">${types.map(([t,n])=>`
            <div style="margin-bottom:11px">
              <div style="display:flex;justify-content:space-between;font-size:.78rem;font-weight:600;margin-bottom:4px">
                <span style="color:var(--ink)">${esc(t)}</span><span style="color:var(--p);font-weight:800">${n}</span>
              </div>
              <div class="bar" style="height:8px"><i style="width:${Math.round(n*100/maxT)}%"></i></div>
            </div>`).join('')}</div>`
          : `<div class="card empty"><div class="ei">📊</div><div class="et">ไม่มีข้อมูล</div></div>`}
        </div>
      </div>

      <div class="sec">📋 งานที่ยังไม่ปิด <small>${open} งาน</small></div>
      ${open ? `<div class="tw"><div class="tsc"><table>
        <thead><tr><th>รหัสงาน</th><th>เครื่องจักร</th><th>ปัญหา</th><th>ผู้รับผิดชอบ</th><th>สถานะ</th><th>แจ้งเมื่อ</th></tr></thead>
        <tbody>${J.filter(j=>OPEN.includes(j.status)).slice(0,60).map(j=>`<tr>
          <td class="mono">${esc(j.id)}</td>
          <td><b>${esc(j.asset_id||'')}</b><div style="font-size:.68rem;color:var(--mut)">${esc(j.machine_name||'')}</div></td>
          <td style="font-size:.75rem">${esc(j.problem_type||'—')}</td>
          <td style="font-size:.75rem">${esc(j.assigned_name||'—')}</td>
          <td><span class="tag ${j.status==='working'?'t-b':j.status==='pending_confirm'?'t-n':'t-m'}">${esc(LBL[j.status]||j.status)}</span></td>
          <td class="mono">${j.created_at ? new Date(j.created_at).toLocaleString('th-TH',{timeZone:'Asia/Bangkok',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}) : '—'}</td>
        </tr>`).join('')}</tbody></table></div></div>`
      : `<div class="card empty"><div class="ei">🎉</div><div class="et">ไม่มีงานค้าง</div></div>`}`;
  }

  /* ════════ แท็บ 3: เครื่องจักร ════════ */
  function viewMach(x){
    const pmBy = {}, lastBy = {}, stBy = {};
    x.pm.forEach(r=>{
      pmBy[r.machine_id] = (pmBy[r.machine_id]||0)+1;
      if(!lastBy[r.machine_id]){ lastBy[r.machine_id]=r.pm_date; stBy[r.machine_id]=r.machine_status; }
    });
    const jobBy = {};
    x.jobs.forEach(j=>{ const a=(j.asset_id||'').trim(); if(a) jobBy[a]=(jobBy[a]||0)+1; });

    const rows = x.machines.map(m=>({
      id:m.id, name:m.name||'', pool:poolOf(m.line), line:m.line||'',
      pm:pmBy[m.id]||0, last:lastBy[m.id]||'', st:stBy[m.id]||'', jobs:jobBy[m.id]||0,
    })).sort((a,b)=> a.pm-b.pm || a.id.localeCompare(b.id));

    const LBL={normal:'ปกติ',broken:'เสีย',repair:'ซ่อมบำรุง',idle:'ไม่ใช้งาน'};
    const CLS={normal:'t-n',broken:'t-b',repair:'t-r',idle:'t-i'};
    const rl = RANGES.find(r=>r.k===range).l;
    const never = rows.filter(r=>r.pm===0).length;

    return `
      <div class="sec">🏭 รายเครื่อง <small>ช่วง ${rl} · เรียงจากทำ PM น้อยที่สุด</small></div>
      <div class="kpis" style="margin-bottom:12px">
        <div class="kpi c-p"><div class="kpi-i">🏭</div><div><div class="kpi-v">${rows.length}</div><div class="kpi-l">เครื่องใช้งาน</div></div></div>
        <div class="kpi c-r"><div class="kpi-i">🚫</div><div><div class="kpi-v">${never}</div><div class="kpi-l">ไม่มี PM เลยในช่วงนี้</div></div></div>
        <div class="kpi c-g"><div class="kpi-i">📋</div><div><div class="kpi-v">${x.pm.length.toLocaleString()}</div><div class="kpi-l">บันทึก PM รวม</div></div></div>
        <div class="kpi c-a"><div class="kpi-i">🛠️</div><div><div class="kpi-v">${x.jobs.length}</div><div class="kpi-l">งานแจ้งซ่อมรวม</div></div></div>
      </div>

      <div class="flt"><input class="srch" id="mq" placeholder="🔍 ค้นหารหัส / ชื่อเครื่อง / Pool…" oninput="Dash.filterMach(this.value)"></div>

      <div class="tw"><div class="tsc"><table>
        <thead><tr><th>รหัส</th><th>ชื่อเครื่องจักร</th><th>Pool</th>
          <th class="num">PM (ครั้ง)</th><th>PM ล่าสุด</th><th>สถานะล่าสุด</th><th class="num">แจ้งซ่อม</th></tr></thead>
        <tbody id="mtb">${rows.map(r=>`
          <tr data-k="${esc((r.id+' '+r.name+' '+r.pool).toLowerCase())}">
            <td class="mono">${esc(r.id)}</td>
            <td>${esc(r.name)}</td>
            <td><span class="tag t-p">${esc(r.pool)}</span></td>
            <td class="num" style="color:${r.pm?'var(--gn)':'var(--rd)'}">${r.pm}</td>
            <td class="mono">${r.last?fmtTH(r.last):'—'}</td>
            <td>${r.st?`<span class="tag ${CLS[r.st]||'t-i'}">${LBL[r.st]||r.st}</span>`:'<span style="color:var(--mut)">—</span>'}</td>
            <td class="num" style="color:${r.jobs?'var(--rd)':'var(--mut)'}">${r.jobs||'—'}</td>
          </tr>`).join('')}</tbody>
      </table></div></div>
      <div style="margin-top:8px;font-size:.73rem;color:var(--mut)" id="mcnt">แสดง ${rows.length} เครื่อง</div>`;
  }

  function filterMach(q){
    const k = String(q||'').trim().toLowerCase();
    let n = 0;
    document.querySelectorAll('#mtb tr').forEach(tr=>{
      const hit = !k || (tr.dataset.k||'').includes(k);
      tr.classList.toggle('hide', !hit); if(hit) n++;
    });
    const c = $('mcnt'); if(c) c.textContent = 'แสดง ' + n + ' เครื่อง';
  }

  /* ════════ ควบคุม ════════ */
  function render(){
    if(!cache) return;
    const v = cur==='pm' ? viewPM : cur==='repair' ? viewRepair : viewMach;
    $('body').innerHTML = v(cache);
  }

  function tab(k){
    cur = k;
    document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on', b.dataset.tab===k));
    render();
  }

  function setRange(k){
    range = k;
    document.querySelectorAll('.rb').forEach(b=>b.classList.toggle('on', b.dataset.r===k));
    load();
  }

  async function load(){
    const btn = $('btn-rfr'); if(btn) btn.disabled = true;
    $('body').innerHTML = '<div class="load"><div class="spin"></div><div>กำลังโหลดข้อมูล…</div></div>';
    try{
      cache = await fetchAll();
      /* เติม Pool dropdown ครั้งแรก */
      const sel = $('f-pool');
      if(sel.options.length <= 1 && cache.allPools.length){
        cache.allPools.forEach(p=>{
          const o = document.createElement('option'); o.value=p; o.textContent='Pool '+p; sel.appendChild(o);
        });
      }
      $('hd-sub').textContent = `${cache.machines.length} เครื่อง · ${cache.pm.length.toLocaleString()} บันทึก PM · ${cache.jobs.length} งานซ่อม`;
      setLive('ok','พร้อมใช้งาน');
      render();
    }catch(e){
      console.error('[Dashboard]', e);
      setLive('err','ต่อไม่ได้');
      $('body').innerHTML = `<div class="err">
        <b>⚠️ ดึงข้อมูลไม่สำเร็จ</b>
        ${esc(e.message||String(e))}
        <div style="margin-top:10px;font-size:.78rem;line-height:1.8">
          ตรวจตามนี้:<br>
          1. รันสคีมา + ไฟล์ seed ครบทุกไฟล์แล้วหรือยัง<br>
          2. ค่า SB_URL / SB_KEY ในไฟล์นี้ถูกต้องไหม<br>
          3. ถ้าเปิด RLS แล้ว ต้องมี policy ให้อ่านได้
        </div></div>`;
    }finally{
      if(btn) btn.disabled = false;
    }
  }

  function init(){
    /* ปุ่มเลือกช่วงเวลา */
    $('f-range').innerHTML = RANGES.map(r=>
      `<button class="rb${r.k===range?' on':''}" data-r="${r.k}" onclick="Dash.setRange('${r.k}')">${r.l}</button>`).join('');
    load();
    /* รีเฟรชเองทุก 60 วินาที เมื่อแท็บเปิดอยู่ */
    setInterval(()=>{ if(!document.hidden) load(); }, 60000);
  }

  return { init, load, tab, setRange, filterMach };
})();

/* ถูกฝังในแผงข้างของโหมดคอม -> ย่อหัวเรื่องลง ไม่ให้ซ้ำกับแถบด้านบนของแผง */
if (new URLSearchParams(location.search).get('pane') === '1') {
  const st = document.createElement('style');
  st.textContent = '.hd{padding:10px 0 16px;margin-bottom:-10px}'
    + '.hd-logo{width:30px;height:30px;font-size:1rem}'
    + '.hd-t{font-size:.95rem}.hd-s{font-size:.66rem}'
    + '.tabs{margin:14px 0 12px}body{padding-bottom:24px}';
  document.head.appendChild(st);
}
window.addEventListener('DOMContentLoaded', () => Dash.init());
</script>
</body>
</html>
